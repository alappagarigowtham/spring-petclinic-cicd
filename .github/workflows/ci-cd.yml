name: Spring PetClinic CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

obs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        run: ./mvnw -B clean package

